name: Sincronizar develop

# Tras cada despliegue, main queda un commit de fusión por delante de develop.
# La regla de «rama al día con su base» obliga a realinearlas antes del
# siguiente PR a producción, así que ese back-merge se hace aquí solo.
#
# Se dispara cuando el CI termina en main, no en el push, para no abrir el PR
# antes de que el commit esté validado.
#
# El PR lo abre la cuenta del secreto SYNC_TOKEN si existe, y si no el propio
# workflow. En cualquiera de los dos casos se fusiona de inmediato: el commit
# ya trae el check «Verify» en verde del CI de main, y el CI omite las
# comprobaciones en este PR justamente para no repetirlas ni entorpecer.

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-develop
  cancel-in-progress: false

jobs:
  sync:
    # Solo cuando el CI viene de un push a main. El CI del propio PR de
    # sincronización también corre sobre la rama main —es su rama de origen—,
    # así que sin este filtro cada sincronización dispararía otra.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    name: Realinear develop con main
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Abrir y fusionar el PR de sincronización
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          pendientes=$(git rev-list --count origin/develop..origin/main)
          if [ "$pendientes" -eq 0 ]; then
            echo "develop ya está al día con main: no hay nada que sincronizar."
            exit 0
          fi
          echo "main lleva $pendientes commit(s) que develop no tiene."

          pr=$(gh pr list --base develop --head main --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            url=$(gh pr create \
              --base develop \
              --head main \
              --title "chore: sincronizar develop con main tras el despliegue" \
              --body "Back-merge automático tras el despliegue. Sin cambios de archivos: realinea \`develop\` con \`main\` para que el próximo PR a producción no se bloquee por la regla de «rama al día con su base».")
            pr=${url##*/}
            echo "PR de sincronización creado: #$pr"
          else
            echo "Reutilizando el PR de sincronización abierto: #$pr"
          fi

          estado=$(gh pr view "$pr" --json state --jq .state)
          if [ "$estado" != "OPEN" ]; then
            echo "El PR #$pr ya está $estado: no hay nada que fusionar."
            exit 0
          fi

          # El check "Verify" se dispara al crear el PR, pero tarda unos
          # segundos en pasar de "queued" a completado. develop exige ese
          # check en verde y la rama al día (regla "strict"), así que
          # fusionar sin esperar pierde la carrera si Actions va cargado:
          # GitHub responde "Required status check is queued" y el job falla
          # con el PR abierto y sin fusionar.
          gh pr checks "$pr" --watch --required --fail-fast
          gh pr merge "$pr" --merge
          echo "PR #$pr fusionado: develop vuelve a estar al día."
