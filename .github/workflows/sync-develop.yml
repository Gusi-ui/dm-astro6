name: Sincronizar develop

# Tras cada despliegue, main queda un commit de fusión por delante de develop.
# La regla de «rama al día con su base» obliga a realinearlas antes del
# siguiente PR a producción, así que ese back-merge se hace aquí solo.
#
# Se dispara cuando el CI termina en main, no en el push: así el commit ya
# tiene el check «Verify» en verde y el PR de sincronización puede fusionarse
# en cuanto se abre, sin esperar a nada.
#
# El PR lo abre github-actions[bot], que para GitHub es un «contribuidor
# primerizo», de modo que su ejecución del CI queda esperando aprobación
# manual (política first_time_contributors). Esa ejecución no aporta nada
# —valida el mismo commit que el CI de main ya validó— pero al fusionar el PR
# expira y se registra como fallida, así que se cancela al terminar.
#
# Por eso no se usa --auto: el check de esa ejecución nunca llegaría a
# ejecutarse sin aprobación manual y el PR se quedaría abierto para siempre.

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: sync-develop
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    name: Realinear develop con main
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Abrir y fusionar el PR de sincronización
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          pendientes=$(git rev-list --count origin/develop..origin/main)
          if [ "$pendientes" -eq 0 ]; then
            echo "develop ya está al día con main: no hay nada que sincronizar."
            exit 0
          fi
          echo "main lleva $pendientes commit(s) que develop no tiene."

          pr=$(gh pr list --base develop --head main --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            url=$(gh pr create \
              --base develop \
              --head main \
              --title "chore: sincronizar develop con main tras el despliegue" \
              --body "Back-merge automático tras el despliegue. Sin cambios de archivos: realinea \`develop\` con \`main\` para que el próximo PR a producción no se bloquee por la regla de «rama al día con su base».")
            pr=${url##*/}
            echo "PR de sincronización creado: #$pr"
          else
            echo "Reutilizando el PR de sincronización abierto: #$pr"
          fi

          gh pr merge "$pr" --merge
          echo "PR #$pr fusionado: develop vuelve a estar al día."

          # Cancela la ejecución del CI que quedó esperando aprobación para ese
          # PR, que si no expira y aparece como fallida en el panel.
          sha=$(git rev-parse origin/main)
          for _ in 1 2 3 4 5 6; do
            huerfano=$(gh run list --workflow=ci.yml --event=pull_request --limit 20 \
              --json databaseId,headSha,status \
              --jq "[.[] | select(.headSha == \"$sha\" and (.status == \"action_required\" or .status == \"waiting\" or .status == \"queued\"))][0].databaseId // empty")
            if [ -n "$huerfano" ]; then break; fi
            sleep 5
          done

          if [ -z "$huerfano" ]; then
            echo "No hay ninguna ejecución pendiente que limpiar."
            exit 0
          fi

          if gh run cancel "$huerfano" 2>/dev/null; then
            echo "Cancelada la ejecución $huerfano, que esperaba aprobación."
          else
            gh api -X DELETE "/repos/$GITHUB_REPOSITORY/actions/runs/$huerfano" \
              && echo "Eliminada la ejecución $huerfano, que no se podía cancelar."
          fi
